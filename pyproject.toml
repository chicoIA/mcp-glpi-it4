[project]
name = "mcp-glpi-it4"
version = "0.1.0"
description = "MCP Server for GLPI — High-level API v2.3 / OAuth2, with dry-run and full rollback"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "IT4Solução" }]
keywords = ["mcp", "glpi", "itsm", "oauth2", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    # Trava de teto: versões fora desta faixa quebram a inspeção de assinatura
    # do FastMCP (issubclass(param.annotation, Context) sem guarda isclass).
    "mcp>=1.9,<2",
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.urls]
Homepage = "https://github.com/chicoIA/mcp-glpi-it4"
Issues = "https://github.com/chicoIA/mcp-glpi-it4/issues"

[project.scripts]
mcp-glpi-it4 = "mcp_glpi_it4.server:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 (license = "MIT")
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_glpi_it4"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
