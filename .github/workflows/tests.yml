name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mcp-glpi-it4:ci .

      - name: Smoke test (tools are registered, stdio handshake)
        run: |
          docker run --rm --entrypoint python \
            -e GLPI_BASE_URL=https://glpi.test \
            -e GLPI_CLIENT_ID=x -e GLPI_CLIENT_SECRET=x \
            -e GLPI_USERNAME=x -e GLPI_PASSWORD=x \
            mcp-glpi-it4:ci -c "
          import asyncio
          from mcp_glpi_it4.server import build_server
          tools = asyncio.run(build_server().list_tools())
          print(len(tools), 'tools')
          assert len(tools) >= 29, tools
          "
